<!doctype html>
<!--
  THROWAWAY SCAFFOLDING (CLAUDE.md rule 4). Delete once `AddDevice` has been
  driven against a board by hand.

  It exists because `web-serial.js` is the one layer of the provisioning path
  that no test reaches: the protocol codec has `node --test` cases, the sketch
  was verified over COM6 with a PowerShell probe, and this is the piece in
  between. Reaching it through `AddDevice` means signing in and unlocking a vault
  first, which makes a transport bug look like an app bug.

  It never writes. READ-ID only, so there is no way for this page to change what
  is on a board.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web Serial transport check</title>
    <style>
      body { font: 14px system-ui; margin: 40px; max-width: 60ch; }
      pre { background: #f3f2ee; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Web Serial transport check</h1>
    <p>Exercises <code>web-serial.js</code> against a board running the provisioning sketch. Read-only.</p>
    <button id="go">Connect and read</button>
    <pre id="out">idle</pre>

    <script type="module">
      import {
        isWebSerialSupported,
        requestPort,
        ProvisioningSession,
      } from '/src/lib/web-serial.js';

      const out = document.getElementById('out');
      const log = (line) => {
        out.textContent += `\n${line}`;
        console.log(`[serial-check] ${line}`);
      };

      out.textContent = `Web Serial supported: ${isWebSerialSupported()}`;

      document.getElementById('go').addEventListener('click', async () => {
        let session = null;
        try {
          const port = await requestPort();
          log('port chosen');

          session = new ProvisioningSession(port);
          const openedAt = performance.now();
          await session.open();
          log(`handshake ok in ${Math.round(performance.now() - openedAt)}ms`);

          const first = await session.readId();
          log(`READ-ID -> ${first ?? '(blank board)'}`);

          // Twice, because the first exchange is the one that has to survive the
          // boot chatter and the second is the one that would expose a reader
          // left holding a stolen chunk.
          const second = await session.readId();
          log(`READ-ID -> ${second ?? '(blank board)'}`);
          log(second === first ? 'PASS: consistent across two exchanges' : 'FAIL: differed');
        } catch (failure) {
          log(`ERROR: ${failure.message}`);
        } finally {
          await session?.close();
          log('closed');
        }
      });
    </script>
  </body>
</html>
