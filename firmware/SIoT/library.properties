name=SIoT
version=0.1.0
author=SIoT
maintainer=SIoT
sentence=Client-side encrypted telemetry for ESP32: reads its credentials from NVS and uploads signed, encrypted records a server cannot read.
paragraph=Implements the SIoT device wire protocol v1 (docs/protocol.md): HKDF-SHA256 key derivation from a provisioned DEVICE_SECRET, a persisted boot_epoch, counter-derived nonces, AES-256-GCM, and Ed25519 signatures. Uses only what the ESP32 Arduino core already ships: mbedTLS, libsodium and TinyCBOR.
